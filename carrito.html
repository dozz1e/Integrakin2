<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Integrakin Medicina Estética</title>
    <!-- Tailwind CSS with custom config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind.config.js"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="selection:bg-primary selection:text-white bg-white">

    <!-- Simple Navigation for Checkout -->
    <header id="main-header" class="fixed top-0 left-0 right-0 z-50 transition-all duration-500 px-6 py-6 border-b border-obsidiana/5 bg-white/80 backdrop-blur-xl">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center group">
                <img src="assets/images/logo.webp" alt="Integrakin" class="h-6 md:h-8 w-auto">
            </a>
            <a href="tienda.html" class="text-[10px] font-sync text-obsidiana/90 hover:text-primary transition-colors uppercase tracking-widest">
                Back to Shop
            </a>
        </div>
    </header>

    <main class="pt-40 pb-32">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl md:text-6xl font-sync text-obsidiana uppercase mb-20 tracking-tighter">Your <span class="text-primary italic">Selection.</span></h1>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-1 items-start">
                <!-- Items Area -->
                <div class="lg:col-span-8 space-y-1">
                    <!-- Cart Item 1 -->
                    <div class="bg-surface p-8 md:p-12 border border-obsidiana/5 flex flex-col md:flex-row items-center gap-12 group reveal-text active">
                        <div class="w-32 h-32 bg-white p-4 border border-obsidiana/5 overflow-hidden shrink-0">
                            <img src="assets/images/maquinas/1.webp" class="w-full h-full object-contain grayscale group-hover:grayscale-0 transition-all duration-700">
                        </div>
                        <div class="flex-1 text-center md:text-left">
                            <span class="text-[8px] font-sync text-obsidiana/20 uppercase tracking-widest block mb-2">Mobiliario</span>
                            <h3 class="text-xl font-sync text-obsidiana uppercase mb-4">Wonder Precision</h3>
                            <p class="text-2xl font-sync text-obsidiana/90 tracking-tighter">$2.490.990</p>
                        </div>
                        <div class="flex items-center gap-12">
                            <div class="flex items-center border border-obsidiana/5 bg-white">
                                <button class="w-12 h-12 flex items-center justify-center text-obsidiana/70 hover:text-primary transition-colors">
                                    <i data-lucide="minus" class="w-3 h-3"></i>
                                </button>
                                <span class="w-8 text-center text-[10px] font-sync text-obsidiana">1</span>
                                <button class="w-12 h-12 flex items-center justify-center text-obsidiana/70 hover:text-primary transition-colors">
                                    <i data-lucide="plus" class="w-3 h-3"></i>
                                </button>
                            </div>
                            <button class="text-obsidiana/20 hover:text-red-500 transition-colors">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Cart Item 2 -->
                    <div class="bg-surface p-8 md:p-12 border border-obsidiana/5 flex flex-col md:flex-row items-center gap-12 group reveal-text active" class="glass-effect">
                        <div class="w-32 h-32 bg-white p-4 border border-obsidiana/5 overflow-hidden shrink-0">
                            <img src="assets/images/maquinas/3.webp" class="w-full h-full object-contain grayscale group-hover:grayscale-0 transition-all duration-700">
                        </div>
                        <div class="flex-1 text-center md:text-left">
                            <span class="text-[8px] font-sync text-obsidiana/20 uppercase tracking-widest block mb-2">Facial</span>
                            <h3 class="text-xl font-sync text-obsidiana uppercase mb-4">DermoPro Max</h3>
                            <p class="text-2xl font-sync text-obsidiana/90 tracking-tighter">$1.299.990</p>
                        </div>
                        <div class="flex items-center gap-12">
                            <div class="flex items-center border border-obsidiana/5 bg-white">
                                <button class="w-12 h-12 flex items-center justify-center text-obsidiana/70 hover:text-primary transition-colors">
                                    <i data-lucide="minus" class="w-3 h-3"></i>
                                </button>
                                <span class="w-8 text-center text-[10px] font-sync text-obsidiana">1</span>
                                <button class="w-12 h-12 flex items-center justify-center text-obsidiana/70 hover:text-primary transition-colors">
                                    <i data-lucide="plus" class="w-3 h-3"></i>
                                </button>
                            </div>
                            <button class="text-obsidiana/20 hover:text-red-500 transition-colors">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Summary Area -->
                <div class="lg:col-span-4 lg:sticky lg:top-40">
                    <div class="bg-surface p-12 border border-obsidiana/5 reveal-text active" class="glass-effect">
                        <h2 class="text-xs font-sync text-obsidiana uppercase mb-12 tracking-widest border-b border-obsidiana/5 pb-8">Order Summary</h2>
                        
                        <div class="space-y-6 mb-12">
                            <div class="flex justify-between text-[10px] font-sync text-obsidiana/70 uppercase tracking-widest">
                                <span>Subtotal</span>
                                <span class="text-obsidiana">$3.790.980</span>
                            </div>
                            <div class="flex justify-between text-[10px] font-sync text-obsidiana/70 uppercase tracking-widest">
                                <span>Shipping</span>
                                <span class="text-primary italic">Free</span>
                            </div>
                            <div class="pt-8 border-t border-obsidiana/5 flex justify-between items-end">
                                <span class="text-[10px] font-sync text-obsidiana uppercase tracking-widest">Total</span>
                                <span class="text-4xl font-sync text-obsidiana tracking-tighter leading-none">$3.790.980</span>
                            </div>
                        </div>

                        <button class="bg-primary text-white w-full py-6 font-sync text-[10px] tracking-[0.3em] hover:bg-obsidiana transition-all uppercase mb-8 shadow-lg shadow-primary/20">
                            Checkout
                        </button>

                        <div class="flex items-center gap-4 text-[8px] font-sync text-obsidiana/20 uppercase tracking-[0.2em] justify-center">
                            <i data-lucide="shield-check" class="w-3 h-3 text-primary"></i> Secure Transaction
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="bg-white py-20 border-t border-obsidiana/5">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8 text-[8px] font-sync text-obsidiana/20 uppercase tracking-[0.4em]">
            <span>© 2026 INTEGRAKIN — GLOBAL LOGISTICS</span>
            <div class="flex gap-12">
                <a href="#" class="hover:text-primary transition-colors">Terms</a>
                <a href="#" class="hover:text-primary transition-colors">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
